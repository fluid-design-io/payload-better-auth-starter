services:
  inbucket:
    image: inbucket/inbucket:latest
    container_name: acme-inbucket
    ports:
      - '9000:9000' # Web UI
      - '2500:2500' # SMTP
      - '1100:1100' # POP3
      - '1430:1430' # IMAP
    environment:
      - INBUCKET_SMTP_DISABLED=false
      - INBUCKET_POP3_DISABLED=false
      - INBUCKET_IMAP_DISABLED=false
      - INBUCKET_WEB_DISABLED=false
      - INBUCKET_WEB_BASE_PATH=/
      - INBUCKET_WEB_COOKIE_AUTH_KEY=acme-dev-secret-key
    volumes:
      - inbucket_data:/var/inbucket
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: acme-seaweedfs
    ports:
      - '127.0.0.1:9001:8333' # S3 API
      - '127.0.0.1:9002:23646' # SeaweedFS Admin UI
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      - seaweedfs_data:/data
    command:
      - mini
      - -dir=/data
      - -bucket=${S3_BUCKET:?Set S3_BUCKET},${S3_PRIVATE_BUCKET:?Set S3_PRIVATE_BUCKET}
    healthcheck:
      test: ['CMD', 'wget', '-Y', 'off', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: acme-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=acme-website
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  inbucket_data:
  seaweedfs_data:
  postgres_data:

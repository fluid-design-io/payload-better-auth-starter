name: Storage integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seaweedfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: payload-seaweedfs-test
      NEXT_TELEMETRY_DISABLED: '1'
      TEST_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Configure disposable environment
        run: |
          mkdir -p .scratch
          bun -e '
            const file = await Bun.file(".env.example").text()
            const keys = ["PAYLOAD_SECRET", "BETTER_AUTH_SECRET", "CRON_SECRET", "PREVIEW_SECRET"]
            const env = keys.reduce((text, key) => text.replace(new RegExp(`^${key}=.*$`, "m"), `${key}=${crypto.randomUUID()}${crypto.randomUUID()}`), file)
            await Bun.write(".env", env)
          '
      - name: Validate configuration and types
        run: |
          docker compose config --quiet
          bun run typecheck
      - name: Start clean services and application
        run: |
          docker compose up -d --wait --wait-timeout 120
          bun run dev:next > .scratch/next.log 2>&1 &
          echo $! > .scratch/next.pid
          bun -e '
            for (let attempt = 0; attempt < 120; attempt++) {
              try {
                const response = await fetch(`${process.env.TEST_SERVER_URL}/api/blog?limit=1`, { signal: AbortSignal.timeout(5000) })
                if (response.ok) process.exit(0)
              } catch {}
              await Bun.sleep(1000)
            }
            throw new Error("Payload did not become ready")
          '
      - name: Check storage integration and existing smoke tests
        run: |
          bun run test:storage
          bun test src/tests/smoke.test.ts
      - name: Collect service status on failure
        if: failure()
        run: docker compose ps --all
      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seaweedfs-results
          path: .scratch/seaweedfs-results.json
          if-no-files-found: ignore
      - name: Stop disposable environment
        if: always()
        run: |
          if [ -f .scratch/next.pid ]; then
            kill "$(cat .scratch/next.pid)" || true
          fi
          docker compose down --volumes
